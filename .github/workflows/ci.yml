name: CI
# ReviewLens CI Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reviewlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Prisma migrations to test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reviewlens_test?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reviewlens_test?schema=public

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run PostgreSQL integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reviewlens_test?schema=public
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reviewlens_test?schema=public
          DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/reviewlens_test?schema=public
          DIRECT_DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5432/reviewlens_test?schema=public

      - name: Build applications
        run: npm run build

      - name: Check formatting
        run: npm run format:check

      - name: Build backend Docker image
        run: docker build -t reviewlens-backend:ci .

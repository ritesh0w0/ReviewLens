server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Health check
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Static assets under /reviewlens/assets/ with 1-year cache
    location ^~ /reviewlens/assets/ {
        alias /usr/share/nginx/html/reviewlens/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static assets fallback
    location ^~ /assets/ {
        alias /usr/share/nginx/html/reviewlens/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing for /reviewlens/
    location ^~ /reviewlens/ {
        alias /usr/share/nginx/html/reviewlens/;
        try_files $uri $uri/ /reviewlens/index.html;
    }

    # Root fallback
    location / {
        try_files $uri $uri/ /reviewlens/index.html =404;
    }
}

